<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хвост и Лапа — кооперативный платформер</title><style>
:root{--ink:#111111;--dark:#333333;--gray:#777777;--sand:#BEB8AD;--paper:#E6E1D7;--bg:#F6F4EE}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ink);border-radius:50px;padding:13px 25px;cursor:pointer;transition:background .18s,color .18s,transform .18s}button:hover{background:var(--paper);transform:translateY(-2px)}button:focus-visible{outline:3px solid var(--gray);outline-offset:4px}.primary{background:var(--ink);color:var(--bg)}.primary:hover{background:var(--dark)}#stage{position:fixed;inset:0;display:grid;place-items:center}canvas{display:block;width:100%;height:100%;object-fit:contain;outline:none}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);transition:opacity .25s;overflow:auto;padding:24px}#overlay.hidden{opacity:0;pointer-events:none}.panel{max-width:1000px;width:100%;padding:24px 32px}.eyebrow{font-size:12px;letter-spacing:5px;text-transform:uppercase}.rule{height:1px;background:var(--sand);margin:26px 0}h1{font-size:clamp(38px,6vw,76px);font-weight:500;letter-spacing:-3px;line-height:1.04;margin:18px 0}h2{font-size:38px;font-weight:500;margin:16px 0}p{line-height:1.55;color:var(--dark)}.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center}.animal-art{width:100%;height:auto;max-height:265px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:28px;font-size:14px}.controls strong{display:block;font-size:18px;margin-bottom:10px}.controls p{margin:5px 0}kbd{display:inline-block;border:1px solid var(--sand);border-radius:6px;padding:4px 7px;font:12px Arial;background:var(--bg)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:25px}.level-card{text-align:left;border-radius:16px;min-height:92px;padding:17px}.level-card small{display:block;letter-spacing:2px;font-size:10px;color:var(--gray);margin-bottom:10px}.level-card b{font-weight:500}.foot{font-size:12px;color:var(--gray);margin-top:24px}#tools{position:fixed;right:16px;bottom:12px;display:flex;gap:6px}#tools button{font-size:12px;padding:7px 13px}#toast{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:30px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center;font-size:14px}#toast.show{opacity:1}@media(max-width:700px){.panel{padding:10px}.hero{grid-template-columns:1fr}.animal-art{max-height:150px}.controls{gap:10px;font-size:12px}.levels{grid-template-columns:repeat(2,1fr)}h1{letter-spacing:-1px}.rule{margin:16px 0}button{padding:10px 16px}#tools{right:6px;bottom:5px}.foot{margin-top:14px}}
</style></head><body><main id="stage"><canvas id="game" width="1920" height="1080" tabindex="0" aria-label="Хвост и Лапа. Корги: WASD. Кошка: стрелки. Esc: пауза."></canvas><section id="overlay" aria-live="polite"></section></main><div id="tools"><button id="sound">Звук: вкл.</button><button id="pause">Пауза · Esc</button><button id="full">На весь экран</button></div><div id="toast" role="status"></div><script>
'use strict';
// Все размеры мира заданы в пикселях canvas. Палитра строго из шести цветов.
const P={ink:'#111111',dark:'#333333',gray:'#777777',sand:'#BEB8AD',paper:'#E6E1D7',bg:'#F6F4EE'},W=1920,H=1080,T=60;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function rect(c,x,y,w,h,color,r=8,stroke=true){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=color;c.fill();if(stroke){c.strokeStyle=P.ink;c.lineWidth=2;c.stroke()}}
function ellipse(c,x,y,rx,ry,color,stroke=true){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fillStyle=color;c.fill();if(stroke){c.strokeStyle=P.ink;c.lineWidth=2;c.stroke()}}
function text(c,s,x,y,size=22,color=P.ink,align='left'){c.font=`${size}px Arial`;c.textAlign=align;c.fillStyle=color;c.fillText(s,x,y)}
function line(c,points,color=P.ink,width=2){c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.strokeStyle=color;c.lineWidth=width;c.stroke()}
class AudioManager{
 constructor(){this.ctx=null;this.muted=false}
 unlock(){try{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}catch(e){}}
 tone(f,end,d=.15,type='sine',delay=0){if(this.muted||!this.ctx)return;const a=this.ctx,t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
 play(name){const n={jump:[220,600,.17],double:[700,1200,.12],dash:[170,35,.23,'sawtooth'],coin:[850,1500,.12],death:[420,45,.4,'triangle'],bark:[160,90,.12,'square'],meow:[650,380,.25],switch:[400,700,.13],enemy:[80,160,.1,'triangle']};if(name==='win'){[440,554,659,880].forEach((f,i)=>this.tone(f,f,.22,'sine',i*.15));return}if(n[name])this.tone(...n[name])}
}
class InputHandler{
 constructor(game){this.down=new Set();this.pressed=new Set();const keys=['KeyA','KeyD','KeyW','KeyS','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Escape','KeyR'];window.addEventListener('keydown',e=>{if(keys.includes(e.code))e.preventDefault();if(!this.down.has(e.code)){this.pressed.add(e.code);if(e.code==='Escape')game.pause();if(e.code==='KeyR'&&game.state==='play')game.restart()}this.down.add(e.code)});window.addEventListener('keyup',e=>this.down.delete(e.code));window.addEventListener('blur',()=>{this.clear();if(game.state==='play')game.pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden){this.clear();if(game.state==='play')game.pause()}})}
 held(k){return this.down.has(k)}tap(k){return this.pressed.has(k)}clear(){this.down.clear();this.pressed.clear()}end(){this.pressed.clear()}
}
class ParticleSystem{
 constructor(){this.items=[]}burst(x,y,n=12,color=P.sand){for(let i=0;i<n;i++)this.items.push({x,y,vx:(Math.random()-.5)*300,vy:-Math.random()*230,life:.4+Math.random()*.35,max:.75,color,r:3+Math.random()*5})}
 update(dt){this.items=this.items.filter(p=>p.life>0);for(const p of this.items){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=450*dt}}draw(c){for(const p of this.items){c.globalAlpha=clamp(p.life/.4,0,1);ellipse(c,p.x,p.y,p.r,p.r,p.color,false)}c.globalAlpha=1}
}
class Entity{constructor(x,y,w,h){Object.assign(this,{x,y,w,h,vx:0,vy:0})}}
class Physics{
 static move(p,level,dt){
 const solids=level.solids();p.x+=p.vx*dt;
 for(const s of solids){if(!hit(p,s))continue;if(s.kind==='fragile'&&p.kind==='dog'&&p.dash>0){s.broken=true;level.game.particles.burst(s.x+s.w/2,s.y+s.h/2,25);level.game.audio.play('bark');continue}
 let pushed=false;if(s.kind==='box'&&p.kind==='dog'){const dx=p.vx*dt,candidate={...s,x:clamp(s.x+dx,0,W-s.w)};if(!solids.some(o=>o!==s&&!o.broken&&hit(candidate,o))){s.x=candidate.x;pushed=true}}
 if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;if(!pushed)p.vx=0}
 p.x=clamp(p.x,0,W-p.w);const previousBottom=p.y+p.h;p.y+=p.vy*dt;p.grounded=false;p.support=null;
 for(const s of level.solids()){if(!hit(p,s))continue;if(p.vy>=0&&previousBottom<=s.y+14){p.y=s.y-p.h;p.vy=0;p.grounded=true;p.support=s}else if(p.vy<0){p.y=s.y+s.h;p.vy=0}else{p.y=s.y-p.h;p.vy=0;p.grounded=true;p.support=s}}
 }
}
class Player extends Entity{
 constructor(kind,x,y){super(x,y,kind==='dog'?76:60,kind==='dog'?64:82);this.kind=kind;this.fullH=this.h;this.face=1;this.grounded=false;this.coyote=0;this.buffer=0;this.extra=kind==='cat'?1:0;this.cooldown=0;this.dash=0;this.invuln=1.3;this.anim=0;this.spin=0;this.crouch=false;this.rope=null}
 update(dt,g){const i=g.input,l=g.level,dog=this.kind==='dog',left=dog?'KeyA':'ArrowLeft',right=dog?'KeyD':'ArrowRight',jump=dog?'KeyW':'ArrowUp',special=dog?'KeyS':'ArrowDown';this.invuln=Math.max(0,this.invuln-dt);this.cooldown=Math.max(0,this.cooldown-dt);this.dash=Math.max(0,this.dash-dt);this.spin=Math.max(0,this.spin-dt);this.buffer=Math.max(0,this.buffer-dt);this.coyote=this.grounded?.1:Math.max(0,this.coyote-dt);if(this.grounded)this.extra=dog?0:1;
 if(this.support&&!this.support.hidden){this.x+=this.support.dx||0;this.y+=this.support.dy||0}
 // Приседание сохраняет положение лап. Встать можно только при свободном потолке.
 const crouch=!dog&&i.held(special)&&!this.rope;
 if(crouch&&!this.crouch){this.y+=this.h-42;this.h=42;this.crouch=true}
 if(!crouch&&this.crouch){const test={x:this.x,y:this.y-(this.fullH-this.h),w:this.w,h:this.fullH};if(!l.solids().some(s=>hit(test,s))){this.y=test.y;this.h=this.fullH;this.crouch=false}}
 if(i.tap(jump))this.buffer=.12;
 if(dog&&i.tap(special)&&this.cooldown===0){this.dash=.18;this.cooldown=2;this.vx=this.face*1000;g.audio.play('dash');g.audio.play('bark')}
 // Кошка цепляется вниз, затем вверх/вниз перемещается по верёвке.
 if(!dog&&i.held(special)&&!this.rope)this.rope=l.ropes.find(r=>hit(this,{x:r.x-35,y:r.y,w:70,h:r.h}));
 if(this.rope){const r=this.rope;if(i.held(left)||i.held(right)||!hit(this,{x:r.x-60,y:r.y-20,w:120,h:r.h+40})){this.rope=null}else{this.vx=0;this.vy=0;this.x=r.x-this.w/2;this.y+=((i.held(special)?1:0)-(i.held(jump)?1:0))*250*dt;this.y=clamp(this.y,r.y-this.h,r.y+r.h-this.h);this.grounded=false;this.extra=1;this.buffer=0;this.anim+=dt;return}}
 const direction=Number(i.held(right))-Number(i.held(left));if(direction)this.face=direction;
 if(this.dash>0){this.vx=this.face*1000;g.particles.burst(this.x+this.w/2,this.y+this.h,2)}else{const target=direction*(this.crouch?150:360);this.vx+=(target-this.vx)*Math.min(1,dt*(direction?12:17))}
 if(this.buffer>0&&(this.coyote>0||(!dog&&this.extra>0&&!this.crouch))){const double=this.coyote===0;if(double){this.extra=0;this.spin=.42;g.audio.play('double')}else g.audio.play('jump');this.vy=-(dog?900:986);this.coyote=0;this.buffer=0;this.grounded=false}
 if(!i.held(jump)&&this.vy<0)this.vy+=2400*dt;this.vy=Math.min(1400,this.vy+2100*dt);if(l.wind)this.vx+=Math.sin(l.time*.65)*l.wind*dt;Physics.move(this,l,dt);this.anim+=dt*(Math.abs(this.vx)>30?12:2);
 }
 draw(c,time){c.save();c.translate(this.x+this.w/2,this.y+this.h/2);if(this.invuln>0)c.globalAlpha=.5+.5*Math.abs(Math.sin(time*12));c.scale(this.face,1);if(this.spin>0)c.rotate((.42-this.spin)/.42*Math.PI*2);c.scale(1,this.h/this.fullH);const walk=this.grounded?Math.sin(this.anim)*3:0;
 if(this.kind==='dog'){
 ellipse(c,-42,4+Math.sin(time*12)*3,10,11,P.sand);for(let n=0;n<4;n++)rect(c,-29+n*16,18+Math.sin(this.anim+n)*3,12,14,P.paper,5);ellipse(c,-4,3+walk,38,25,P.sand);ellipse(c,2,12+walk,30,13,P.bg);ellipse(c,20,-12+walk,27,25,P.sand);
 c.beginPath();c.moveTo(1,-29+walk);c.lineTo(4,-52+walk);c.lineTo(18,-32+walk);c.moveTo(25,-33+walk);c.lineTo(38,-51+walk);c.lineTo(44,-24+walk);c.fillStyle=P.sand;c.fill();c.strokeStyle=P.ink;c.stroke();ellipse(c,28,-4+walk,19,12,P.bg);ellipse(c,18,-18+walk,2.8,3.5,P.ink,false);ellipse(c,37,-17+walk,2.8,3.5,P.ink,false);ellipse(c,31,-7+walk,4,3,P.ink,false);line(c,[[31,-4+walk],[31,2+walk],[26,5+walk]]);
 }else{
 c.beginPath();c.moveTo(-20,20);c.bezierCurveTo(-65,30,-60,-30+Math.sin(time*3)*10,-43,-12);c.strokeStyle=P.ink;c.lineWidth=15;c.lineCap='round';c.stroke();c.strokeStyle=P.gray;c.lineWidth=11;c.stroke();c.lineWidth=2;
 ellipse(c,0,10+walk,29,32,P.gray);ellipse(c,4,17+walk,17,24,P.paper);rect(c,-22,27+walk,17,14,P.gray,7);rect(c,7,27-walk,17,14,P.gray,7);ellipse(c,0,-19+walk,30,26,P.gray);for(const side of [-1,1]){c.beginPath();c.moveTo(side*20,-40+walk);c.bezierCurveTo(side*43,-36+walk,side*42,-14+walk,side*27,-17+walk);c.lineTo(side*19,-29+walk);c.fillStyle=P.gray;c.fill();c.strokeStyle=P.ink;c.stroke()}ellipse(c,1,-10+walk,21,12,P.paper);line(c,[[-17,-18+walk],[-12,-21+walk],[-7,-18+walk]]);line(c,[[6,-18+walk],[11,-21+walk],[16,-18+walk]]);c.beginPath();c.moveTo(-3,-10+walk);c.lineTo(4,-10+walk);c.lineTo(1,-6+walk);c.fillStyle=P.ink;c.fill();line(c,[[1,-6+walk],[1,-1+walk],[-4,2+walk]]);line(c,[[-19,-7+walk],[-36,-10+walk]]);line(c,[[20,-7+walk],[36,-10+walk]]);
 }c.restore()}
}
class Corgi extends Player{constructor(x,y){super('dog',x,y)}}class Cat extends Player{constructor(x,y){super('cat',x,y)}}
const TYPES={drop:{label:'ВОДА',target:'cat',w:44,h:35,speed:85},rain:{label:'ДОЖДЬ',target:'cat',w:85,h:42,speed:65},mat:{label:'МОКРО',target:'cat',w:88,h:15,speed:0},spark:{label:'ТОК',target:'dog',w:38,h:38,speed:90},thunder:{label:'ТОК',target:'dog',w:85,h:42,speed:45},slime:{label:'ЯД',target:'dog',w:65,h:30,speed:50},vacuum:{label:'ОБОИМ',target:'both',w:66,h:36,speed:115},mower:{label:'ОБОИМ',target:'both',w:75,h:40,speed:220}};
class Enemy extends Entity{
 constructor(d){const type=TYPES[d.type];super(d.x,d.y,type.w,type.h);Object.assign(this,type,d);this.baseY=d.y;this.min=d.min??d.x-80;this.max=d.max??d.x+100;this.direction=1;this.clock=Math.random();this.active=true;this.trail=0;this.age=0}
 update(dt,l){this.age+=dt;this.x+=this.speed*this.direction*dt;if(this.x>this.max){this.x=this.max;this.direction=-1}if(this.x<this.min){this.x=this.min;this.direction=1}if(this.type==='spark')this.y=this.baseY+Math.sin(this.age*3)*65;if(this.type==='mat')this.active=l.game.players.some(p=>p.kind==='cat'&&Math.abs(p.x-this.x)<190);this.clock+=dt;this.trail+=dt;
 if(['rain','thunder'].includes(this.type)&&this.clock>2){this.clock=0;l.projectiles.push({x:this.x+this.w/2,y:this.y+this.h,w:this.type==='rain'?13:19,h:this.type==='rain'?20:60,vx:0,vy:this.type==='rain'?320:650,target:this.target,life:3.5,type:this.type})}
 if(this.type==='slime'&&this.trail>.6){this.trail=0;l.trails.push({x:this.x,y:this.y+this.h-6,w:45,h:12,target:'dog',life:2.8,type:'poison'})}}
 draw(c,t){if(this.type==='drop'){ellipse(c,this.x+22,this.y+19,22,16,P.sand);line(c,[[this.x+6,this.y+18],[this.x+20,this.y+23],[this.x+35,this.y+18]])}else if(['rain','thunder'].includes(this.type)){for(let j=0;j<3;j++)ellipse(c,this.x+19+j*23,this.y+24-Math.sin(j)*9,24,19,P.sand);text(c,this.type==='rain'?'///':'ϟ',this.x+42,this.y+32,28,P.ink,'center')}else if(this.type==='spark'){const x=this.x,y=this.y;line(c,[[x+22,y],[x+4,y+23],[x+20,y+20],[x+10,y+38],[x+36,y+12],[x+20,y+14]],P.ink,5)}else if(this.type==='slime'){ellipse(c,this.x+32,this.y+20,32,14,P.sand);for(let j=0;j<4;j++)ellipse(c,this.x+10+j*14,this.y+17+Math.sin(t*4+j)*3,2,2,P.ink,false)}else if(this.type==='mat'){rect(c,this.x,this.y,this.w,this.h,this.active?P.dark:P.sand,4);if(this.active)line(c,[[this.x,this.y-8],[this.x+25,this.y-13],[this.x+55,this.y-8],[this.x+88,this.y-13]],P.gray,3)}else{rect(c,this.x,this.y,this.w,this.h,P.paper,18);ellipse(c,this.x+17,this.y+this.h,8,8,P.ink);ellipse(c,this.x+this.w-17,this.y+this.h,8,8,P.ink);line(c,[[this.x+16,this.y+14],[this.x+this.w-16,this.y+14]],P.ink,3);if(this.type==='mower'){line(c,[[this.x-12,this.y+40],[this.x+this.w+12,this.y+40]],P.ink,5);line(c,[[this.x-10,this.y-8],[this.x+this.w+10,this.y-8]],P.gray,3)}}text(c,this.label,this.x+this.w/2,this.y-14,13,P.gray,'center')}
}
class Boss extends Entity{
 constructor(){super(855,300,210,95);this.hp=6;this.time=0;this.shot=0;this.cycle=-1;this.hitCycle=-1;this.baseX=this.x;this.hurt=0}
 get phase(){return this.hp>4?1:this.hp>2?2:3}get vulnerable(){return this.time%5>3.7}get mode(){return Math.floor(this.time/5)%2?'dog':'cat'}
 update(dt,l){if(this.hp<=0)return;this.time+=dt;this.hurt=Math.max(0,this.hurt-dt);this.x=this.baseX+Math.sin(this.time*.8)*400;this.y=300+Math.sin(this.time*1.3)*50;this.shot+=dt;const cycle=Math.floor(this.time/5);
 if(!this.vulnerable&&this.shot>1.4-this.phase*.26){this.shot=0;for(const p of l.game.players){const dx=p.x+p.w/2-(this.x+this.w/2),dy=p.y+p.h/2-(this.y+this.h),norm=Math.hypot(dx,dy);for(let j=0;j<this.phase;j++)l.projectiles.push({x:this.x+this.w/2,y:this.y+this.h,w:22,h:26,vx:dx/norm*(280+this.phase*60)+(j-(this.phase-1)/2)*95,vy:dy/norm*(280+this.phase*60),life:4,target:this.mode,type:this.mode==='cat'?'rain':'thunder'})}}
 if(this.vulnerable&&l.pairActive&&this.hitCycle!==cycle){this.hp--;this.hitCycle=cycle;this.hurt=.5;l.game.audio.play('switch');l.game.particles.burst(this.x+this.w/2,this.y+50,30);if(this.hp===0){l.doorOpen=true;l.game.ui.toast('Дворник выключен! Вместе доберитесь до домика.');l.game.audio.play('win')}}}
 draw(c){if(this.hp<=0)return;rect(c,this.x,this.y,this.w,this.h,this.hurt>0?P.bg:P.sand,40);ellipse(c,this.x+44,this.y+88,19,19,P.dark);ellipse(c,this.x+166,this.y+88,19,19,P.dark);rect(c,this.x+62,this.y+20,86,37,P.dark,12);text(c,this.mode==='cat'?'≈':'ϟ',this.x+105,this.y+49,32,P.bg,'center');line(c,[[this.x+105,this.y],[this.x+105,this.y-30]],P.ink,3);ellipse(c,this.x+105,this.y-36,8,8,this.vulnerable?P.bg:P.dark);text(c,this.vulnerable?'УЯЗВИМ · ОБЕ КНОПКИ':'АТАКА · '+(this.mode==='cat'?'ВОДА → КОШКА':'ТОК → КОРГИ'),960,193,21,P.ink,'center');text(c,`БЕЗУМНЫЙ ДВОРНИК / ФАЗА ${this.phase}`,960,135,18,P.gray,'center');for(let j=0;j<6;j++)rect(c,840+j*42,153,32,9,j<this.hp?P.ink:P.paper,3,false)}
}

 for(const b of this.buttons){rect(c,b.x,b.y,b.w,b.h,b.active?P.ink:P.sand,6);text(c,b.index?'B':'A',b.x+b.w/2,b.y-8,14,P.gray,'center')}if(this.data.weightButton){const b=this.data.weightButton;rect(c,b.x,b.y,b.w,b.h,this.weightOpen?P.ink:P.sand,6);text(c,'ЯЩИК',b.x+b.w/2,b.y-10,13,P.gray,'center');if(!this.weightOpen){const s=this.data.weightGate;rect(c,s.x,s.y,s.w,s.h,P.gray,5);text(c,'ЗАМOК',s.x,s.y-15,13)}}

class LevelManager{constructor(){this.index=0;this.data=LEVEL_DATA}load(index,g){this.index=index;return new Level(this.data[index],g)}}
class ScoreManager{
 constructor(){this.scores=[0,0];this.last=null;this.best=0;try{this.best=Number(localStorage.getItem('tail-and-paw-best'))||0}catch(e){}}
 get total(){return this.scores[0]+this.scores[1]}
 collect(i,time){this.scores[i]+=50;if(this.last&&this.last.i!==i&&time-this.last.time<.35){this.scores[i]+=13;this.scores[1-i]+=12}this.last={i,time}}
 death(i){this.scores[i]=Math.max(0,this.scores[i]-10)}finish(time){const bonus=time<60?200:time<90?100:0;this.scores=this.scores.map(s=>s+50+bonus/2);this.save();return bonus}save(){if(this.total>this.best){this.best=this.total;try{localStorage.setItem('tail-and-paw-best',String(this.best))}catch(e){}}}
}
class UIManager{

 hide(){this.overlay.classList.add('hidden');this.game.canvas.focus();this.game.input.clear()}
 artwork(){return '<canvas class="animal-art" id="portrait" width="600" height="320" aria-label="Бежевый корги и серая вислоухая кошка"></canvas>'}
 paintArt(){const el=document.getElementById('portrait');if(!el)return;const c=el.getContext('2d');c.fillStyle=P.bg;c.fillRect(0,0,600,320);line(c,[[10,272],[580,272]],P.sand);c.save();c.translate(110,145);c.scale(2,2);const dog=new Corgi(0,0);dog.invuln=0;dog.draw(c,0);c.restore();c.save();c.translate(350,105);c.scale(2,2);const cat=new Cat(0,0);cat.invuln=0;cat.draw(c,0);c.restore();text(c,'01 / ХВОСТ',190,305,14,P.gray,'center');text(c,'02 / ЛАПА',410,305,14,P.gray,'center')}
 menu(){const g=this.game;g.state='menu';this.show(`<div class="eyebrow">TAIL & PAW / LOCAL CO-OP</div><div class="hero"><div><h1>Хвост<br>и Лапа<span style="color:var(--sand)">.</span></h1><p>Семь мест. Два друга.<br>Домой можно добраться только вместе.</p></div>${this.artwork()}</div><div class="rule"></div><div class="controls"><div><strong>01 / Корги</strong><p><kbd>A</kbd> <kbd>D</kbd> — идти · <kbd>W</kbd> — прыгнуть · <kbd>S</kbd> — рывок</p><p>Толкает тяжести, ломает стенки.<br>Береги от электричества и яда.</p></div><div><strong>02 / Кошка</strong><p><kbd>←</kbd> <kbd>→</kbd> — идти · <kbd>↑</kbd> — двойной прыжок</p><p><kbd>↓</kbd> — присесть / зацепиться за верёвку.<br>Береги от воды и громкого шума.</p></div></div><div class="actions"><button class="primary" id="start">Начать прогулку ↗</button><button id="levels">Выбрать уровень</button><button id="guide">Как играть</button></div><p class="foot">7 уровней · 5 общих жизней · одна клавиатура · рекорд ${g.score.best} очков<br>Для игры нужен компьютер. Некоторые клавиатуры ограничивают число одновременных нажатий.</p>`,{start:()=>g.newRun(0),levels:()=>this.selection(),guide:()=>this.guide()});this.paintArt()}
 selection(){this.show(`<div class="eyebrow">CHOOSE A CHAPTER</div><h2>Куда отправимся?</h2><p>Выбирайте любое место для тренировки. Счёт и 5 жизней начинаются заново; дальше можно продолжить остальные уровни.</p><div class="levels">${LEVEL_DATA.map((l,i)=>`<button class="level-card" id="level${i}"><small>ГЛАВА / 0${i+1}</small><b>${l.name} ↗</b></button>`).join('')}</div><div class="actions"><button id="back">← Главное меню</button></div>`,Object.fromEntries([...LEVEL_DATA.map((_,i)=>['level'+i,()=>this.game.newRun(i)]),['back',()=>this.menu()]]))}
 guide(){this.show(`<div class="eyebrow">A LITTLE FIELD GUIDE</div><h2>Вместе — до домика</h2><div class="controls"><div><strong>Путь и способности</strong><p>Корги толкает ящики, <kbd>S</kbd> разбивает треснувшие стенки. Рывок восстанавливается 2 секунды.</p><p>Кошка выше прыгает. Для двойного прыжка отпустите <kbd>↑</kbd> и нажмите снова. В узком проходе держите <kbd>↓</kbd>.</p><p>Верёвка: зацепиться <kbd>↓</kbd>, лазать <kbd>↑</kbd> / <kbd>↓</kbd>, отпустить <kbd>←</kbd> / <kbd>→</kbd>.</p></div><div><strong>Общий план</strong><p>Оба героя на разных кнопках A/B открывают дверь. Оба в зоне CP сохраняют место возрождения.</p><p>Вода / шум → кошка. Ток / яд → корги. Шипы, кислота, роботы и пропасть → оба. Дым и грязь безопасны.</p><p>5 жизней на всю прогулку. Сфера +50, синхронный сбор +25 общих. Уровень +100. Быстрее 60 / 90 секунд: +200 / +100. Смерть −10.</p></div></div><p>Босс: парные кнопки наносят один удар за каждое окно уязвимости. Всего 6 ударов, 3 фазы. Ящики служат укрытием от снарядов.</p><div class="actions"><button class="primary" id="back">Понятно</button></div>`,{back:()=>this.menu()})}
 pause(){this.show(`<div class="eyebrow">TAKE A BREATH</div><h2>Остановимся на минутку.</h2><p>${this.game.level.data.name} · ${Math.floor(this.game.level.time)} секунд</p><p>${this.game.level.data.tip}</p><div class="actions"><button id="resume" class="primary">Продолжить · Esc</button><button id="restart">Сначала · R</button><button id="menu">Главное меню</button></div>`,{resume:()=>this.game.pause(),restart:()=>{this.game.state='play';this.game.restart();this.hide()},menu:()=>this.menu()})}
 result(won,bonus=0){const g=this.game,final=won&&g.manager.index===6;this.show(`<div class="eyebrow">${won?'CHAPTER COMPLETE':'TRY AGAIN TOGETHER'}</div><h2>${won?(final?'Вы дома. Вместе.':'Ещё на шаг ближе к дому.'): 'Прогулка закончилась.'}</h2><p>${won?g.level.data.name+' пройден. Бонус времени: +'+bonus+'.':'Общие жизни закончились. Попробуйте другой маршрут и используйте чекпоинты.'}</p><div class="rule"></div><div class="controls"><div><strong>${g.score.total} общих очков</strong><p>Корги ${g.score.scores[0]} · Кошка ${g.score.scores[1]}</p></div><div><strong>Рекорд ${g.score.best}</strong><p>${g.deaths} смертей · ${Math.floor(g.level.time)} сек. на уровне</p></div></div><div class="actions">${won&&!final?'<button class="primary" id="next">Следующая глава ↗</button>':'<button class="primary" id="again">Новая прогулка</button>'}<button id="select">Выбрать уровень</button><button id="menu">Главное меню</button></div>`,{next:()=>g.load(g.manager.index+1),again:()=>g.newRun(0),select:()=>this.selection(),menu:()=>this.menu()})}
 hud(c){const g=this.game,s=g.score,l=g.level;rect(c,55,28,1810,75,P.bg,20);text(c,`КОРГИ  ${s.scores[0]}`,85,61,20);text(c,g.players[0].cooldown>0?`РЫВОК ${g.players[0].cooldown.toFixed(1)} с`:'РЫВОК ГОТОВ',85,85,14,P.gray);text(c,`КОШКА  ${s.scores[1]}`,365,61,20);text(c,g.players[1].extra?'ДВОЙНОЙ ПРЫЖОК ГОТОВ':'ДВОЙНОЙ ПРЫЖОК —',365,85,14,P.gray);text(c,`ОБЩИЙ ${s.total}`,700,70,23);text(c,'ЖИЗНИ',1020,59,13,P.gray);for(let j=0;j<5;j++)ellipse(c,1030+j*25,80,7,7,j<g.lives?P.ink:P.paper,false);text(c,`${String(Math.floor(l.time/60)).padStart(2,'0')}:${String(Math.floor(l.time%60)).padStart(2,'0')}`,1290,71,25);text(c,`0${g.manager.index+1} / 07`,1470,70,22);text(c,`РЕКОРД ${s.best}`,1635,70,17,P.gray)}
}
class Game{
 constructor(){this.canvas=document.getElementById('game');this.ctx=this.canvas.getContext('2d');this.state='menu';this.audio=new AudioManager();this.input=new InputHandler(this);this.particles=new ParticleSystem();this.manager=new LevelManager();this.score=new ScoreManager();this.players=[];this.level=null;this.ui=new UIManager(this);this.lives=5;this.deaths=0;this.last=0;this.elapsed=0;this.accumulator=0;this.entryScores=[0,0];this.levelLoss=[0,0];this.transition=0}
 start(){this.ui.menu();requestAnimationFrame(t=>this.frame(t))}
 newRun(index){this.score.scores=[0,0];this.score.last=null;this.lives=5;this.deaths=0;this.audio.unlock();this.load(index)}
 load(index){this.entryScores=[...this.score.scores];this.levelLoss=[0,0];this.build(index)}
 build(index){this.level=this.manager.load(index,this);this.players=[new Corgi(95,890),new Cat(190,870)];this.particles.items=[];this.state='play';this.accumulator=0;this.score.last=null;this.transition=.4;this.ui.hide();this.ui.toast(this.level.data.tip)}
 restart(){if(this.state!=='play')return;this.score.scores=this.entryScores.map((s,i)=>Math.max(0,s-this.levelLoss[i]));this.build(this.manager.index);this.ui.toast('Уровень начат заново. Собранные здесь очки сброшены, потраченные жизни не возвращаются.')}
 pause(){if(this.state==='play'){this.state='pause';this.input.clear();this.ui.pause()}else if(this.state==='pause'){this.state='play';this.ui.hide();this.accumulator=0}}
 die(p,i,cause){this.lives--;this.deaths++;this.levelLoss[i]+=10;this.score.death(i);this.audio.play('death');this.particles.burst(p.x+p.w/2,p.y+p.h/2,28,P.gray);if(this.lives<=0||this.deaths>15){this.state='lose';this.score.save();this.ui.result(false);return}const spawn=this.level.spawn[i];const fresh=p.kind==='dog'?new Corgi(spawn.x,spawn.y):new Cat(spawn.x,spawn.y);this.players[i]=fresh;this.ui.toast(`${p.kind==='dog'?'Корги':'Кошка'}: ${({'water':'вода','electric':'электричество','poison':'яд','noise':'шум','acid':'кислота','rain':'дождь','thunder':'разряд','spikes':'шипы'})[cause]||cause}. Осталось жизней: ${this.lives}.`)}
 complete(){if(this.state!=='play')return;this.state='win';const bonus=this.score.finish(this.level.time);this.audio.play('win');this.ui.result(true,bonus)}
 update(dt){this.level.update(dt);for(const p of this.players)p.update(dt,this);if(this.level.boss)this.level.boss.update(dt,this.level);this.level.interactions();this.particles.update(dt);this.input.end()}
 frame(t){const dt=Math.min(.05,(t-this.last)/1000||0);this.last=t;this.elapsed+=dt;if(this.state==='play'){this.accumulator+=dt;let steps=0;while(this.accumulator>=1/120&&this.state==='play'&&steps++<8){this.update(1/120);this.accumulator-=1/120}}
 if(this.level){this.level.draw(this.ctx);for(const p of this.players)p.draw(this.ctx,this.elapsed);this.particles.draw(this.ctx);this.ui.hud(this.ctx);if(this.transition>0){this.transition=Math.max(0,this.transition-dt);this.ctx.globalAlpha=this.transition/.4;this.ctx.fillStyle=P.bg;this.ctx.fillRect(0,0,W,H);this.ctx.globalAlpha=1}}requestAnimationFrame(time=>this.frame(time))}
}
window.addEventListener('load',()=>{window.tailAndPaw=new Game();window.tailAndPaw.start()});
</script></body></html>
